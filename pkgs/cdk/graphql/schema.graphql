# 車の情報を表す型
type Car {
	licenseplate: String!
	brand: String!
	tradename: String
	expirydateapk: String
	firstcolor: String!
	cylindercount: String
	cylindervolume: String
	firstregistrationdate: String
	catalogprice: String
	length: String
	width: String
	# 車に関連する不具合のリスト
	defects: [Defect]
}

# 不具合情報を表す型
type Defect {
	licenseplate: String!
	defectstartdate: String
	defectdescription: String
}

type Query {
	# ナンバープレートで車を検索するクエリ
	getCar(licenseplate: String!): Car
}

schema {
	query: Query
}
