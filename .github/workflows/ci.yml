name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

# キャンセルポリシー: 同じPR/ブランチで新しいワークフローが起動したら、古いものをキャンセル
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ========================================
  # 1. 依存関係のインストールとキャッシング
  # ========================================
  setup:
    name: Setup Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            pkgs/*/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

  # ========================================
  # 2. Lintチェック (Biome)
  # ========================================
  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    needs: setup

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            pkgs/*/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Run Biome lint (frontend)
        run: pnpm --filter frontend run lint

      - name: Check code formatting
        run: pnpm run format --check

  # ========================================
  # 3. 型チェック
  # ========================================
  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    needs: setup

    strategy:
      matrix:
        package: [frontend, cdk]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            pkgs/*/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Type check ${{ matrix.package }}
        run: pnpm --filter ${{ matrix.package }} run build

  # ========================================
  # 4. ビルド
  # ========================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]

    strategy:
      matrix:
        package: [frontend, cdk]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            pkgs/*/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Build ${{ matrix.package }}
        run: pnpm --filter ${{ matrix.package }} run build

      - name: Upload build artifacts (${{ matrix.package }})
        uses: actions/upload-artifact@v6
        with:
          name: build-${{ matrix.package }}
          path: |
            pkgs/${{ matrix.package }}/dist
            pkgs/${{ matrix.package }}/.next
            pkgs/${{ matrix.package }}/out
          retention-days: 7
          if-no-files-found: ignore

  # ========================================
  # 5. テスト
  # ========================================
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: setup

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            pkgs/*/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Run CDK tests
        run: pnpm --filter cdk run test
        env:
          CI: true

  # ========================================
  # 6. セキュリティ監査
  # ========================================
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: setup

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            pkgs/*/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Run security audit
        run: pnpm audit --audit-level moderate
        continue-on-error: true

      - name: Check for known vulnerabilities
        run: |
          echo "Checking for critical vulnerabilities..."
          pnpm audit --audit-level high || echo "High severity vulnerabilities found. Please review."

  # ========================================
  # 7. 依存関係チェック
  # ========================================
  dependencies:
    name: Dependency Check
    runs-on: ubuntu-latest
    needs: setup

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Check for outdated dependencies
        run: pnpm outdated || true

      - name: Verify lock file is up to date
        run: |
          pnpm install --frozen-lockfile
          if [ -n "$(git status --porcelain pnpm-lock.yaml)" ]; then
            echo "❌ pnpm-lock.yaml is not up to date. Please run 'pnpm install' and commit the changes."
            exit 1
          fi

  # ========================================
  # 8. 最終チェック (すべてのジョブが成功したか)
  # ========================================
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [lint, typecheck, build, test, security, dependencies]
    if: always()

    steps:
      - name: Check all jobs status
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.typecheck.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.security.result }}" != "success" ] || \
             [ "${{ needs.dependencies.result }}" != "success" ]; then
            echo "❌ CI failed. Please check the logs above."
            exit 1
          fi
          echo "✅ All CI checks passed!"
