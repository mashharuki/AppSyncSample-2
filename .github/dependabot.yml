# 依存関係の自動更新設定
# セキュリティパッチとバグ修正を定期的に適用するため
version: 2

updates:
  # ルートのnpm依存関係
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # バージョンアップデート戦略
    versioning-strategy: increase

  # Frontend パッケージ
  - package-ecosystem: "npm"
    directory: "/pkgs/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
      - "automated"
    commit-message:
      prefix: "chore(deps-frontend)"
      include: "scope"
    versioning-strategy: increase

  # CDK パッケージ
  - package-ecosystem: "npm"
    directory: "/pkgs/cdk"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "cdk"
      - "automated"
    commit-message:
      prefix: "chore(deps-cdk)"
      include: "scope"
    versioning-strategy: increase

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
      - "automated"
    commit-message:
      prefix: "chore(deps-actions)"
      include: "scope"
